name: Publish 🚀

on:
  workflow_dispatch:

  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'

      - name: Restore
        run: dotnet restore ./TimeService.sln

      - name: Build
        run: dotnet build ./TimeService.sln --configuration Release --no-restore

      - name: Publish
        run: dotnet publish ./TimeService.sln --configuration Release --no-build
